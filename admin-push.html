<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMAI — Enable Admin Notifications</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Mulish,sans-serif;background:#3A322E;color:#F7F1EA;display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:20px}
.card{text-align:center;max-width:400px;width:100%}
.arch{width:22px;height:30px;border:1.6px solid #E8D5C4;border-bottom:none;border-radius:999px 999px 0 0;margin:0 auto 12px}
h1{font-family:Marcellus,serif;font-weight:400;font-size:28px;margin:0 0 8px}
p{color:#CBB49E;font-size:15px;line-height:1.7;margin:0 0 32px}
.btn{display:block;width:100%;padding:18px;font-size:17px;font-family:Marcellus,serif;border:none;cursor:pointer;background:#E8D5C4;color:#3A322E;border-radius:24px 24px 0 0}
.btn:disabled{opacity:.5;cursor:default}
.status{margin-top:16px;font-size:14px;color:#B39C88}
</style>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Mulish:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="push-register.js"></script>
</head>
<body>
<div class="card">
  <div class="arch"></div>
  <h1>Admin Notifications</h1>
  <p>Enable push notifications to get alerted on your phone when a new booking or enquiry comes in.</p>
  <button class="btn" id="go">Enable notifications</button>
  <div class="status" id="status"></div>
</div>
<script>
window.sb = supabase.createClient(
  'https://tphyrmweauzfletdlqvi.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRwaHlybXdlYXV6ZmxldGRscXZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0NTIxOTQsImV4cCI6MjEwMzAyODE5NH0.Z_utKsxYquCoL2LfTjjL8QFB1tnLJZW9j3El7Sykk8o'
);

var btn = document.getElementById('go');
var status = document.getElementById('status');

// Check if already registered
if('serviceWorker' in navigator && 'PushManager' in window){
  navigator.serviceWorker.register('/sw.js').then(function(reg){
    return reg.pushManager.getSubscription();
  }).then(function(sub){
    if(sub){
      btn.textContent = 'Notifications enabled ✓';
      btn.disabled = true;
      status.textContent = 'You will receive alerts for new bookings and enquiries.';
    }
  }).catch(function(){});
}

btn.onclick = async function(){
  btn.textContent = 'Enabling…';
  btn.disabled = true;
  status.textContent = '';
  
  var ok = await registerPush('admin');
  if(ok){
    btn.textContent = 'Notifications enabled ✓';
    status.textContent = 'Done! You will receive alerts for new bookings and enquiries.';
  } else {
    btn.textContent = 'Enable notifications';
    btn.disabled = false;
    status.textContent = 'Could not enable. Make sure you tap "Allow" when prompted. On iOS, add this page to your home screen first.';
  }
};
</script>
</body>
</html>
