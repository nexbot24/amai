<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<title>AMAI — My account</title>
<meta name="theme-color" content="#241F1C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AMAI">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon/amai-favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicon/amai-favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Mulish:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Mulish,sans-serif;color:#F7F1EA;background:#241F1C;overscroll-behavior-y:contain}
button,input,textarea,select{font-family:inherit;font-size:16px;color:inherit}
a{color:#E8D5C4;text-decoration:none}
.app{max-width:480px;margin:0 auto;background:#241F1C;min-height:100dvh;position:relative;overflow-x:clip}
.serif{font-family:Marcellus,serif;font-weight:400}
.lbl{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#B39C88}
.arch{border-radius:999px 999px 0 0}
.hide{display:none!important}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes veil{from{opacity:0}to{opacity:1}}
.view{display:none}
.view.on{display:block;animation:rise .34s ease both}

/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(36,31,28,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(232,213,196,.12);padding-top:env(safe-area-inset-top)}
.topin{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.mark{display:flex;align-items:center;gap:11px}
.mark i{display:block;width:13px;height:18px;border:1.4px solid #E8D5C4;border-bottom:none;border-radius:999px 999px 0 0}
.mark span{font-family:Marcellus,serif;font-size:16px;letter-spacing:.32em;color:#E8D5C4}
.avatar{width:38px;height:38px;border-radius:50%;background:#3A322E;border:1px solid rgba(232,213,196,.24);display:flex;align-items:center;justify-content:center;font-family:Marcellus,serif;font-size:16px;color:#E8D5C4}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(36,31,28,.96);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid rgba(232,213,196,.14);padding-bottom:env(safe-area-inset-bottom)}
.tabin{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:64px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:none;background:none;color:#B39C88;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;position:relative;padding:0}
.tab i{display:block;width:16px;height:16px;border:1.3px solid currentColor;border-bottom:none;border-radius:999px 999px 0 0}
.tab.on{color:#E8D5C4}
.tab.on::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:24px;height:2px;background:#E8D5C4}
.tab:active{opacity:.6}
.dot{position:absolute;top:12px;right:calc(50% - 17px);width:7px;height:7px;border-radius:50%;background:#E8D5C4}

/* structure */
.sec{padding:24px 20px 0}
.sec.last{padding-bottom:34px}
.h1{font-family:Marcellus,serif;font-weight:400;font-size:31px;line-height:1.14;margin:0}
.card{border:1px solid rgba(232,213,196,.18);background:#2C2623;padding:20px}
.card.warm{background:#3A322E;border-color:rgba(232,213,196,.22)}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid rgba(232,213,196,.13);font-size:15px}
.row:last-child{border-bottom:none}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border:none;font-family:Marcellus,serif;font-size:16.5px;border-radius:26px 26px 0 0;background:#E8D5C4;color:#3A322E}
.btn:active{background:#F7F1EA}
.btn-o{background:transparent;color:#E8D5C4;border:1px solid rgba(232,213,196,.32)}
.btn-o:active{background:#3A322E}
.btn-sm{min-height:44px;font-size:15px;border-radius:22px 22px 0 0;padding:0 18px}
.btn-q{flex-direction:column;gap:9px;min-height:88px;background:#2C2623;border:1px solid rgba(232,213,196,.16);color:#E8D5C4;border-radius:0;font-size:14px}
.btn-q i{display:block;width:17px;height:23px;border:1.3px solid #B39C88;border-bottom:none;border-radius:999px 999px 0 0}
.btn-q:active{background:#3A322E}

/* fields */
.field{width:100%;background:transparent;border:1px solid rgba(232,213,196,.28);color:#F7F1EA;padding:14px 16px;outline:none;border-radius:0}
.field:focus{border-color:#E8D5C4}
.field::placeholder{color:#B39C88}
.flab{display:flex;flex-direction:column;gap:9px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#B39C88}
.chip{min-height:46px;padding:0 16px;border-radius:23px 23px 0 0;background:transparent;border:1px solid rgba(232,213,196,.28);color:#E8D5C4;font-size:15px;width:100%}
.chip[aria-pressed="true"]{background:#E8D5C4;color:#3A322E;border-color:#E8D5C4;font-weight:600}
.chip[disabled]{color:rgba(232,213,196,.26);border-color:rgba(232,213,196,.12);text-decoration:line-through}
.seg{display:grid;grid-auto-flow:column;gap:0;border:1px solid rgba(232,213,196,.22)}
.seg button{min-height:44px;background:transparent;border:none;color:#B39C88;font-size:14px;letter-spacing:.04em}
.seg button[aria-pressed="true"]{background:#E8D5C4;color:#3A322E;font-weight:600}

/* loyalty card */
.loyal{background:linear-gradient(160deg,#463C36 0%,#332C28 58%,#2A2421 100%);border:1px solid rgba(232,213,196,.24);padding:22px;position:relative;overflow:hidden}
.loyal::after{content:"";position:absolute;right:20px;top:14px;width:104px;height:132px;border:1px solid rgba(232,213,196,.09);border-bottom:none;border-radius:999px 999px 0 0;pointer-events:none}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;position:relative}
.stamp{aspect-ratio:1/1;border-radius:50%;border:1px solid rgba(232,213,196,.26);display:flex;align-items:center;justify-content:center;font-family:Marcellus,serif;font-size:14px;color:#B39C88;background:transparent;padding:0}
.stamp.on:active{background:#F7F1EA}
.stamp.on{background:#E8D5C4;border-color:#E8D5C4;color:#3A322E}
.stamp.key{border-color:rgba(232,213,196,.5);color:#CBB49E;font-size:11px;letter-spacing:.04em}
.stamp.on.key{color:#3A322E;font-weight:600}

/* list rows */
.srow{display:flex;align-items:center;gap:14px;width:100%;padding:15px 16px;background:transparent;border:1px solid rgba(232,213,196,.16);color:#E8D5C4;text-align:left}
.srow[aria-checked="true"]{background:#3A322E;border-color:#E8D5C4}
.tick{flex:none;width:18px;height:18px;border-radius:50%;border:1px solid rgba(232,213,196,.3)}
.srow[aria-checked="true"] .tick{background:#E8D5C4;border-color:#E8D5C4}
.pick{max-height:244px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.pick::-webkit-scrollbar{display:none}

/* calendar */
.cal{border:1px solid rgba(232,213,196,.16);padding:6px 10px 12px}
.calbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0 10px}
.calnav{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid rgba(232,213,196,.24);color:#E8D5C4;font-size:16px}
.calnav[disabled]{opacity:.24}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding-bottom:6px}
.dow span{text-align:center;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#B39C88}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dcell{position:relative;aspect-ratio:1/1;min-height:42px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;color:#E8D5C4;font-family:Marcellus,serif;font-size:16px;padding:0}
.dcell u{position:absolute;bottom:6px;width:4px;height:4px;border-radius:50%;background:#B39C88}
.dcell[disabled]{color:rgba(232,213,196,.18)}
.dcell[aria-pressed="true"]{background:#E8D5C4;color:#3A322E;font-weight:600}
.dcell[aria-pressed="true"] u{background:#3A322E}
.blank{aspect-ratio:1/1;min-height:42px}

/* switch */
.sw{position:relative;width:46px;height:28px;border-radius:14px;background:rgba(232,213,196,.2);border:none;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#8A7361;transition:transform .2s ease,background .2s ease}
.sw[aria-pressed="true"]{background:#E8D5C4}
.sw[aria-pressed="true"]::after{transform:translateX(18px);background:#3A322E}

/* sheet + toast */
.swrap{position:fixed;inset:0;z-index:40;background:rgba(18,15,14,.62);display:flex;align-items:flex-end;animation:veil .2s ease both}
.sheet{width:100%;max-width:480px;margin:0 auto;max-height:90dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#2C2623;border-top:1px solid rgba(232,213,196,.22);padding:14px 20px calc(26px + env(safe-area-inset-bottom));animation:up .3s cubic-bezier(.32,.72,0,1) both;scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
.grab{width:40px;height:4px;border-radius:2px;background:rgba(232,213,196,.28);margin:0 auto 16px}
.toast{position:fixed;left:50%;bottom:calc(82px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;background:#E8D5C4;color:#3A322E;padding:13px 20px;font-size:14px;line-height:1.5;max-width:86%;text-align:center;animation:rise .24s ease both}
</style>
</head>
<body>
<div class="app" id="root">
  <div class="top">
    <div class="topin">
      <a class="mark" href="mobile.html"><i></i><span>AMAI</span></a>
      <button class="avatar" id="me" aria-label="Account"></button>
    </div>
  </div>
  <main style="padding-bottom:88px">
    <div class="view on" id="v-home"></div>
    <div class="view" id="v-visits"></div>
    <div class="view" id="v-rewards"></div>
    <div class="view" id="v-account"></div>
  </main>
</div>

<nav class="tabs">
  <div class="tabin">
    <button class="tab on" data-go="home"><i></i>Today</button>
    <button class="tab" data-go="visits"><i></i>Visits</button>
    <button class="tab" data-go="rewards"><i></i>Rewards</button>
    <button class="tab" data-go="account"><i></i>Account</button>
  </div>
</nav>

<div id="host"></div>

<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#241F1C"/><path d="M36 72 L36 46 A14 14 0 0 1 64 46 L64 72" fill="none" stroke="#E8D5C4" stroke-width="4"/></svg></template>

<div id="m-auth" style="position:fixed;inset:0;z-index:10000;background:#241F1C;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center">
  <div style="max-width:340px;width:100%">
    <div style="margin-bottom:32px">
      <div style="width:24px;height:34px;border:1.5px solid #E8D5C4;border-bottom:none;border-radius:999px 999px 0 0;margin:0 auto 14px"></div>
      <div class="serif" style="font-size:16px;letter-spacing:.3em;color:#E8D5C4">AMAI</div>
    </div>
    <div id="m-step-email">
      <h2 class="serif" style="color:#E8D5C4;font-size:26px;margin:0 0 10px">Sign in to your hub</h2>
      <p style="font-size:14px;line-height:1.7;color:#8A7361;margin:0 0 24px">We'll email you a six-digit code. No password needed.</p>
      <input id="m-email" type="email" placeholder="your@email.com" style="width:100%;padding:14px 16px;border:1px solid #5C5148;border-radius:12px;font-size:16px;background:#3A322E;color:#E8D5C4;margin-bottom:14px;font-family:inherit;outline:none">
      <button id="m-send" style="width:100%;padding:14px;border:none;border-radius:12px;font-size:16px;font-family:Marcellus,serif;background:#E8D5C4;color:#241F1C;cursor:pointer">Send my code</button>
      <div id="m-send-err" style="font-size:13px;color:#B39C88;margin-top:12px"></div>
      <a href="mobile.html" style="display:inline-block;margin-top:24px;font-size:13px;color:#5C5148;text-decoration:none;border-bottom:1px solid #5C5148">Back to the site</a>
    </div>
    <div id="m-step-code" style="display:none">
      <h2 class="serif" style="color:#E8D5C4;font-size:26px;margin:0 0 10px">Enter your code</h2>
      <p id="m-code-msg" style="font-size:14px;line-height:1.7;color:#8A7361;margin:0 0 24px"></p>
      <input id="m-code" inputmode="numeric" maxlength="6" placeholder="••••••" style="width:100%;padding:14px 16px;border:1px solid #5C5148;border-radius:12px;font-size:22px;letter-spacing:.4em;text-align:center;background:#3A322E;color:#E8D5C4;margin-bottom:14px;font-family:inherit;outline:none">
      <button id="m-verify" style="width:100%;padding:14px;border:none;border-radius:12px;font-size:16px;font-family:Marcellus,serif;background:#E8D5C4;color:#241F1C;cursor:pointer">Sign in</button>
      <div id="m-code-err" style="font-size:13px;color:#B39C88;margin-top:12px"></div>
      <button id="m-code-back" style="display:inline-block;margin-top:20px;font-size:13px;color:#5C5148;background:none;border:none;border-bottom:1px solid #5C5148;cursor:pointer">Change email</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseUrl = 'https://tphyrmweauzfletdlqvi.supabase.co';
const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRwaHlybXdlYXV6ZmxldGRscXZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0NTIxOTQsImV4cCI6MjEwMzAyODE5NH0.Z_utKsxYquCoL2LfTjjL8QFB1tnLJZW9j3El7Sykk8o';
const sb = supabase.createClient(supabaseUrl, supabaseKey);

var $=function(i){return document.getElementById(i);};
var KEY="amai_hub_v2";
var SERVICES=[];
async function loadServices(){
  var {data}=await sb.from('services').select('*').eq('available',true).order('sort_order');
  if(data) SERVICES=data.map(function(s){return {n:s.name,t:s.duration_minutes+' min',p:Number(s.price)};});
}
var PREP=[
  ["Hair length","About a quarter of an inch — two to three weeks of growth. Don't shave in between."],
  ["On the day","Clean, dry skin, no oils or lotions. Exfoliate gently the day before, not the same morning."],
  ["Comfort","Avoid caffeine right before, and wear something loose for afterwards. Ask us to pause at any point."]
];
var AFTER={
  "Hollywood wax":"Keep the area cool and dry for 24 hours. No swimming, sauna or tight clothing. Exfoliate gently from day three.",
  "Brazilian wax":"Keep the area cool and dry for 24 hours. Loose cotton only. Gentle exfoliation from day three.",
  "Bikini wax":"Avoid heat and friction for 24 hours. Hydrate daily, exfoliate lightly from day three.",
  "Full leg wax":"No hot baths or sun for 24 hours. Moisturise daily; exfoliate from day two to keep ingrowns away.",
  "Half leg wax":"No hot baths or sun for 24 hours. Moisturise daily from tomorrow.",
  "Brow shape & tidy":"Avoid make-up on the area for a few hours. A little redness settles within the hour.",
  "Underarm wax":"Skip deodorant until tomorrow. Loose sleeves help for the first evening."
};

function d0(){ var d=new Date(); d.setHours(0,0,0,0); return d; }
function key(d){ return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate(); }
function dayKeyToDate(k){ var p=k.split('-'); var d=new Date(+p[0],+p[1],+p[2]); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dateToDayKey(ds){ var d=new Date(ds+'T00:00:00'); return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate(); }
function parseK(k){ var p=String(k).split("-"); return new Date(+p[0],+p[1],+p[2]); }
function isOpen(d){ return d.getDay()!==0&&d.getDay()!==1; }
function freeDay(d){ return (d.getDate()*7+d.getMonth()*3)%6!==0; }
function openDay(n){ var d=d0(),c=0; while(c<n){ d.setDate(d.getDate()+1); if(isOpen(d)) c++; } return d; }
function relDay(n){ var d=d0(); d.setDate(d.getDate()+n); return d; }
function longD(d){ return d.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"}); }
function shortD(d){ return d.toLocaleDateString("en-GB",{day:"numeric",month:"short"}); }
function slotsFor(d){ return ["9.00","10.30","12.00","13.30","15.00","16.30"].map(function(l,i){ return {l:l,open:(d.getDate()+i*3)%4!==0}; }); }
function money(n){ return "£"+n; }
function daysTo(k){ return Math.round((parseK(k)-d0())/86400000); }
function svc(n){ return SERVICES.filter(function(s){ return s.n===n; })[0]; }
function getDuration(name){
  var t=svc(name); if(!t) return 60;
  var m=String(t.t).match(/(\d+)/);
  return m?parseInt(m[1],10):60;
}

var DEFAULTS={
  signedIn:false, name:"", phone:"", email:"", since:"",
  stamps:0, plan:null, notes:"",
  prefs:{room:"",music:""},
  notify:{reminder:true,aftercare:true,openings:false,news:false},
  card:null,
  referrals:[],
  upcoming:[],
  past:[]
};
function load(){
  var s={},j;
  for(j in DEFAULTS) s[j]=DEFAULTS[j];
  try{ var v=JSON.parse(localStorage.getItem(KEY));
    if(v) for(j in v) if(v[j]!==undefined&&v[j]!==null) s[j]=v[j];
  }catch(e){}
  s.prefs=s.prefs||DEFAULTS.prefs; s.notify=s.notify||DEFAULTS.notify;
  s.upcoming=s.upcoming||[]; s.past=s.past||[]; s.referrals=s.referrals||[];
  if(typeof s.stamps!=="number") s.stamps=0;
  return s;
}
var S=load(), view="home";
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
function toast(msg){
  var old=document.querySelector(".toast"); if(old) old.remove();
  var t=document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t); setTimeout(function(){ if(t.parentNode) t.remove(); },3000);
}
function first(){ return (S.name||"there").split(" ")[0]; }
function nextVisit(){ return S.upcoming.slice().sort(function(a,b){ return parseK(a.dateKey)-parseK(b.dateKey); })[0]||null; }
/* oldest earned visit first, so stamp 1 is the earliest */
function earners(){
  return S.past.slice().sort(function(a,b){ return parseK(a.dateKey)-parseK(b.dateKey); });
}
function stampsHTML(n){
  var e=earners(), o="";
  for(var i=1;i<=10;i++){
    var k=(i===5||i===10), filled=i<=n;
    var label=(i===5?"25%":i===10?"FREE":i);
    if(filled) o+='<button class="stamp on'+(k?" key":"")+'" data-stamp="'+i+'" aria-label="Stamp '+i+'">'+label+'</button>';
    else o+='<div class="stamp'+(k?" key":"")+'">'+label+'</div>';
  }
  return o;
}
function stampSheet(i){
  var e=earners(), v=e[e.length-S.stamps+(i-1)];
  var body = v?
    '<div class="card" style="margin-bottom:16px">'+
      '<div class="serif" style="font-size:21px;margin-bottom:5px">'+v.treat+'</div>'+
      '<div style="font-size:14px;color:#CBB49E;margin-bottom:14px">'+longD(parseK(v.dateKey))+' · '+v.time+'</div>'+
      '<div style="display:flex;justify-content:space-between;gap:14px;font-size:13.5px;padding-top:12px;border-top:1px solid rgba(232,213,196,.16)">'+
        '<span style="color:#B39C88">Paid</span><span>'+money(v.price)+'</span></div></div>'+
    '<div style="display:flex;gap:8px">'+
      '<button class="btn btn-o btn-sm" data-again2="'+v.treat+'" style="flex:1">Book this again</button>'+
      '<button class="btn btn-o btn-sm" data-after2="'+v.treat+'" style="flex:1">Aftercare</button></div>'
    :
    '<div class="card" style="margin-bottom:16px"><p style="font-size:14px;line-height:1.75;color:#CBB49E;margin:0">'+
      'This stamp came from a visit before your account was set up, so we don\'t have the details on file. The studio has them — ask any time.</p></div>'+
    '<button class="btn btn-o" data-close="1">Close</button>';
  var note = i===5? "This one unlocked 25% off." : i===10? "This one made a visit free." : "";
  sheet('<div class="lbl" style="margin-bottom:12px">Stamp '+i+' of 10</div>'+
    '<h2 class="serif" style="font-size:25px;line-height:1.2;margin:0 0 '+(note?"8px":"18px")+'">Earned on this visit.</h2>'+
    (note?'<p style="font-size:14px;line-height:1.7;color:#CBB49E;margin:0 0 18px">'+note+'</p>':'')+
    body);
}
function rewardLine(n){
  if(n>=10) return "Your next visit is free — we take it off at the studio, nothing to show us.";
  if(n>=5) return "25% off is ready to use. "+(10-n)+(n===9?" more visit":" more visits")+" and it's free.";

  return (5-n)+(n===4?" more stamp":" more stamps")+" and 25% comes off a visit.";
}

function countdown(k){
  var n=daysTo(k);
  return n<0?"Passed":n===0?"Today":n===1?"Tomorrow":"In "+n+" days";

function calHTML(){
  var v=new Date(d0().getFullYear(),d0().getMonth()+draft.off,1), t=d0();
  var firstDow=(v.getDay()+6)%7, dim=new Date(v.getFullYear(),v.getMonth()+1,0).getDate(), cells="";
  for(var i=0;i<firstDow;i++) cells+='<div class="blank"></div>';
  for(var n=1;n<=dim;n++){
    var d=new Date(v.getFullYear(),v.getMonth(),n), k=key(d);
    var ok = d>=t && isOpen(d) && freeDay(d);
    cells+='<button class="dcell" data-day="'+k+'" aria-pressed="'+(draft.dateKey===k)+'"'+(ok?"":" disabled")+'>'+n+(ok?'<u></u>':'')+'</button>';
  }
  return '<div class="cal"><div class="calbar">'+
    '<button class="calnav" data-hop="-1"'+(draft.off<=0?" disabled":"")+'>←</button>'+
    '<span class="serif" style="font-size:18px">'+v.toLocaleDateString("en-GB",{month:"long",year:"numeric"})+'</span>'+
    '<button class="calnav" data-hop="1"'+(draft.off>=5?" disabled":"")+'>→</button></div>'+
    '<div class="dow"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>'+
    '<div class="grid">'+cells+'</div></div>';
}

    list=list.concat([{l:draft.keep,open:true}]).sort(function(a,b){ return parseFloat(a.l)-parseFloat(b.l); });
  return '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+list.map(function(s){

function wire(scope){
  var root=scope||document;
  var q=function(s){ return [].slice.call(root.querySelectorAll(s)); };
  var one=function(id){ return root.querySelector("#"+id); };

  q("[data-go]").forEach(function(b){ b.onclick=function(){ go(b.dataset.go); }; });
  q("[data-tab]").forEach(function(b){ b.onclick=function(){ closeSheet(); go(b.dataset.tab); }; });
  q("[data-vtab]").forEach(function(b){ b.onclick=function(){ S.vtab=b.dataset.vtab; save(); render(); }; });
  q("[data-book]").forEach(function(b){ b.onclick=function(){ startBook(S.plan?S.plan.treat:""); }; });
  q("[data-rebook]").forEach(function(b){ b.onclick=function(){
    var last=S.past.slice().sort(function(x,y){ return parseK(y.dateKey)-parseK(x.dateKey); })[0];
    startBook(S.plan?S.plan.treat:(last?last.treat:"")); }; });
  q("[data-move]").forEach(function(b){ b.onclick=function(){ closeSheet(); startMove(b.dataset.move); }; });
  q("[data-cancel]").forEach(function(b){ b.onclick=function(){ cancelSheet(b.dataset.cancel); }; });
  q("[data-dropit]").forEach(function(b){ b.onclick=async function(){
    var bid=b.dataset.dropit;
    S.upcoming=S.upcoming.filter(function(x){ return String(x.id)!==bid&&x.id!==bid; });
    if(sb) await sb.from('bookings').update({status:'cancelled'}).eq('id',bid);
    save(); closeSheet(); render(); toast("Cancelled. Your deposit is on its way back."); }; });
  q("[data-prep]").forEach(function(b){ b.onclick=function(){
    var v=S.upcoming.filter(function(x){ return String(x.id)===String(b.dataset.prep); })[0]; if(v) prepSheet(v.treat); }; });
  q("[data-after]").forEach(function(b){ b.onclick=function(){
    var v=S.past.filter(function(x){ return String(x.id)===String(b.dataset.after); })[0]; if(v) afterSheet(v.treat); }; });
  q("[data-again]").forEach(function(b){ b.onclick=function(){
    var v=S.past.filter(function(x){ return String(x.id)===String(b.dataset.again); })[0]; if(v) startBook(v.treat); }; });
  q("[data-again2]").forEach(function(b){ b.onclick=function(){ startBook(b.dataset.again2); }; });

  q("[data-treat]").forEach(function(b){ b.onclick=function(){ draft.treat=b.dataset.treat; refreshBook(); }; });
  q("[data-day]").forEach(function(b){ b.onclick=function(){ draft.dateKey=b.dataset.day; draft.time=""; refreshBook(); }; });
  q("[data-slot]").forEach(function(b){ b.onclick=function(){ draft.time=b.dataset.slot; refreshBook(); }; });
  q("[data-hop]").forEach(function(b){ b.onclick=function(){ draft.off=Math.min(5,Math.max(0,draft.off+ +b.dataset.hop)); refreshBook(); }; });
  q("[data-plan]").forEach(function(b){ b.onclick=function(){ draft={}; planSheet(); }; });
  q("[data-plantreat]").forEach(function(b){ b.onclick=function(){ draft.plan.treat=b.dataset.plantreat; planSheet(); }; });
  q("[data-planweeks]").forEach(function(b){ b.onclick=function(){ draft.plan.weeks=+b.dataset.planweeks; planSheet(); }; });
  q("[data-notify]").forEach(function(b){ b.onclick=function(){

  var sq=one("s-q"); if(sq) sq.oninput=function(){

  var ok=one("s-ok"); if(ok) ok.onclick=async function(){

  var ac=one("a-card"); if(ac) ac.onclick=cardSheet;

  var kok=one("k-ok"); if(kok) kok.onclick=function(){
    var num=$("k-num").value.replace(/\D/g,"");
    if(num.length<15){ toast("That card number looks short."); return; }
    S.card={brand:"Visa",last4:num.slice(-4),exp:$("k-exp").value.trim()||"—"};
    save(); closeSheet(); render(); toast("Card saved."); };
  var as=one("a-save"); if(as) as.onclick=async function(){
    S.name=one("a-name").value.trim()||S.name;
    S.phone=one("a-phone").value.trim();
    S.email=one("a-email").value.trim();
    if(S.clientId) {
      await sb.from('clients').update({ name: S.name, phone: S.phone }).eq('id', S.clientId);
    }
    save(); toast("Details saved.");

  var an=one("a-savenotes"); if(an) an.onclick=async function(){
    S.notes=one("a-notes").value.trim();
    S.prefs.room=one("a-room").value.trim();
    S.prefs.music=one("a-music").value.trim();
    if(S.clientId) {
      await sb.from('clients').update({ notes: S.notes }).eq('id', S.clientId);
    }
    save(); toast("Preferences saved.");
  };
  var so=one("signout"); if(so) so.onclick=async function(){ await sb.auth.signOut(); Object.assign(S, DEFAULTS); localStorage.clear(); location.href="mobile.html"; };

  var apwa = one("a-pwa"); if(apwa) apwa.onclick = async function() {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      var choice = await deferredPrompt.userChoice;
      if (choice.outcome === 'accepted') { deferredPrompt = null; checkPWA(); }
    } else if (isIos()) {
      sheet('<div class="lbl" style="margin-bottom:12px">Install AMAI</div>'+

          '<li style="margin-bottom:12px">Scroll down and tap <strong>Add to Home Screen</strong>.</li>'+
        '</ol>'+
        '<button class="btn btn-o" data-close="1">Close</button>');
    }
  };

}

function clock(ts){ return new Date(ts).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}); }
function dayStamp(ts){
  var d=new Date(ts); d.setHours(0,0,0,0);
  var diff=Math.round((d0()-d)/86400000);
  if(diff===0) return "Today";
  if(diff===1) return "Yesterday";
  if(diff<7) return new Date(ts).toLocaleDateString("en-GB",{weekday:"long"});
  return new Date(ts).toLocaleDateString("en-GB",{day:"numeric",month:"long"});
}

  w.style.height=Math.max(320,Math.round(h))+"px";

async function loadConversation() {
  if (!S.phone) return;
  var {data} = await sb.from('conversations').select('id, client_unread').eq('client_phone', S.phone).maybeSingle();
  if (data) {
    convId = data.id;
    chatUnreadCount = data.client_unread || 0;
    
    var {data: msgs} = await sb.from('chat_messages').select('*').eq('conversation_id', convId).order('created_at', {ascending: true});
    if (msgs) {
      S.chat = msgs.map(m => ({
        id: m.id,
        who: m.sender === 'client' ? 'me' : 'them',
        at: new Date(m.created_at).getTime(),
        body: m.body,
        seen: m.seen
      }));
    } else {
      S.chat = [];
    }

    if (!chatSub) {
      chatSub = sb.channel('client-inbox').on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages',filter:'conversation_id=eq.'+convId},function(payload){
        if(payload.new.sender==='studio'){
          if (!S.chat) S.chat = [];
          S.chat.push({
            id: payload.new.id,
            who: 'them',
            at: new Date(payload.new.created_at).getTime(),
            body: payload.new.body,
            seen: payload.new.seen
          });
          chatUnreadCount++;
          if (view === 'inbox') {
            chatUnreadCount = 0;
            sb.from('conversations').update({client_unread: 0}).eq('id', convId).then(function(){});
          }
          renderThread(true);
          badge();
        }
      }).subscribe();
    }
  } else {
    convId = null;
    chatUnreadCount = 0;
    S.chat = [];
  }
  save();
  renderThread(true);
  badge();
}
function renderThread(stick){
  var t=$("thread"); if(!t) return;
  if (!S.chat) S.chat = [];
  var atBottom = stick || (t.scrollHeight-t.scrollTop-t.clientHeight)<80;
  var last="", out="";
  S.chat.forEach(function(m,i){
    var day=dayStamp(m.at);
    if(day!==last){ out+='<div class="dayline"><b></b><span>'+day+'</span><b></b></div>'; last=day; }
    var prev=S.chat[i-1], next=S.chat[i+1];
    var run = prev && prev.who===m.who && dayStamp(prev.at)===day && (m.at-prev.at)<600000;
    var lastOfRun = !(next && next.who===m.who && dayStamp(next.at)===day && (next.at-m.at)<600000);
    out+='<div class="bub '+(m.who==="me"?"mine":"them")+(run?" run":"")+'">'+m.body+'</div>';
    if(lastOfRun) out+='<div class="stamp2 '+(m.who==="me"?"mine":"them")+'">'+clock(m.at)+
      (m.who==="me"?' · '+(m.seen?"Read":"Sent"):'')+'</div>';
  });
  if(typing) out+='<div class="typing"><i></i><i></i><i></i></div>';
  t.innerHTML=out;
  if($("c-status")) $("c-status").textContent = typing? "Typing…" : "Replies within the hour";
  if(atBottom) t.scrollTop=t.scrollHeight;
  renderSugg();
}
async function sendMsg(text){
  var body=(text||"").trim(); if(!body) return;
  if (!S.chat) S.chat = [];
  var tempId = Date.now();
  S.chat.push({id:tempId,who:"me",at:Date.now(),body:body});
  var ta=$("c-in"); if(ta) { ta.value=""; ta.style.height="auto"; }
  var btn=$("c-send"); if(btn) btn.disabled=true;
  renderThread(true);
  
  if (!convId) {
    var {data, error} = await sb.from('conversations').insert({
      client_phone: S.phone,
      client_name: S.name || '',
      client_id: null,
      last_message_at: new Date().toISOString(),
      last_message_preview: body,
      last_sender: 'client',
      admin_unread: 0,
      client_unread: 0
    }).select().single();
    if (data) convId = data.id;
  }
  
  if (convId) {
    await sb.from('chat_messages').insert({
      conversation_id: convId,
      sender: 'client',
      body: body,
      seen: false
    });
  }
}
async function markRead() {
  chatUnreadCount = 0;
  badge();
  if (convId) {
    await sb.from('conversations').update({client_unread: 0}).eq('id', convId);
  }
}
function badge(){
  var t=document.querySelector('.tab[data-go="rewards"]');
  if(t){
    var old=t.querySelector(".dot"); if(old) old.remove();
    if(S.stamps>=5){ var d=document.createElement("span"); d.className="dot"; t.appendChild(d); }
  }
  var i=document.querySelector('.tab[data-go="inbox"]');
  if(i){
    var oc=i.querySelector(".count"); if(oc) oc.remove();
    if(chatUnreadCount){ var c=document.createElement("span"); c.className="count"; c.textContent=chatUnreadCount; i.appendChild(c); }
  }
}
function go(name){
  view=name;
  if(name==="inbox"){
    markRead();
  }
  ["home","visits","inbox","rewards","account"].forEach(function(v){ var el=$("v-"+v); if(el) el.className = v===name?"view on":"view"; });
  [].forEach.call(document.querySelectorAll(".tab"),function(t){ t.className = t.dataset.go===name?"tab on":"tab"; });
  window.scrollTo(0,0);
  render();
  if(name==="inbox"){ fitChat(); renderThread(true); var ta=$("c-in"); if(ta) ta.blur(); }
}
function render(){
  ["home","visits","rewards","account"].forEach(function(v){ var el=$("v-"+v); if(el) el.innerHTML=V[v](); });
  var justBuilt=!chatBuilt;
  if(justBuilt) buildChat();
  renderThread(justBuilt);
  $("me").textContent=(first()[0]||"A").toUpperCase();
  badge(); wire(document);
  checkPWA();
}

let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  checkPWA();
});

function isIos() { return /iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase()); }
function checkPWA() {
  var pwa = $("pwa-card"); if(!pwa) return;
  var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
  if(isStandalone) { pwa.style.display = "none"; }
  else if (isIos() || deferredPrompt) { pwa.style.display = "block"; }
  else { pwa.style.display = "none"; }
}

if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }

async function initSupabase() {
  await loadServices();
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    /* show login overlay */
    document.getElementById("m-auth").style.display="flex";
    document.getElementById("m-send").onclick=async function(){
      var email=document.getElementById("m-email").value.trim().toLowerCase();
      if(!email||!email.includes("@")){ document.getElementById("m-send-err").textContent="Please enter a valid email."; return; }
      this.disabled=true; this.textContent="Sending\u2026";
      var res=await sb.auth.signInWithOtp({email:email,options:{shouldCreateUser:true}});
      this.disabled=false; this.textContent="Send my code";
      if(res.error){ document.getElementById("m-send-err").textContent=res.error.message; return; }
      window.__pendingEmail=email;
      document.getElementById("m-code-msg").textContent="Code sent to "+email+". It lasts ten minutes.";
      document.getElementById("m-step-email").style.display="none";
      document.getElementById("m-step-code").style.display="block";
      document.getElementById("m-code").focus();
    };
    document.getElementById("m-code-back").onclick=function(){
      document.getElementById("m-step-code").style.display="none";
      document.getElementById("m-step-email").style.display="block";
    };
    document.getElementById("m-verify").onclick=async function(){
      var code=document.getElementById("m-code").value.replace(/\D/g,"");
      if(code.length<6){ document.getElementById("m-code-err").textContent="Six digits, please."; return; }
      this.disabled=true; this.textContent="Verifying\u2026";
      var res=await sb.auth.verifyOtp({email:window.__pendingEmail,token:code,type:'email'});
      this.disabled=false; this.textContent="Sign in";
      if(res.error){ document.getElementById("m-code-err").textContent=res.error.message; return; }
      document.getElementById("m-auth").style.display="none";
      location.reload();
    };
    await loadServices();
    $("me").onclick=function(){ go("account"); };
    [].forEach.call(document.querySelectorAll(".tab"),function(t){ t.onclick=function(){ go(t.dataset.go); }; });
    render();
    return;
  }
  /* session exists — hide login, load data */
  document.getElementById("m-auth").style.display="none";
    S.email = session.user.email;
    let res = await sb.from('clients').select('*').eq('email', S.email);
    if (res.data && res.data.length > 0) {
      var c = res.data[0];
      S.name = c.name || S.name;
      S.stamps = c.stamps || 0;
      S.notes = c.notes || "";
      S.clientId = c.id;
      var today = new Date(); today.setHours(0,0,0,0);
      var bk = await sb.from('bookings').select('*').eq('client_id',c.id).neq('status','cancelled');
      if(bk.data){
        S.upcoming=[]; S.past=[];
        bk.data.forEach(function(b){
          var v={id:b.id,treat:b.treatment_name,dateKey:dateToDayKey(b.appointment_date),time:b.appointment_time,price:Number(b.price),deposit:Number(b.deposit_amount||10)};
          var d=parseK(dateToDayKey(b.appointment_date));
          if(b.status==='completed'||d<today) S.past.push(v);
          else S.upcoming.push(v);
        });
      }
    }
  
  $("me").onclick=function(){ go("account"); };
  [].forEach.call(document.querySelectorAll(".tab"),function(t){ t.onclick=function(){ go(t.dataset.go); }; });
  render();
}
initSupabase();
</script>
