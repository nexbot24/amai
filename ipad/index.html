<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Amai Studio</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Amai Studio">
<meta name="theme-color" content="#241F1C">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%233A322E'/%3E%3Ctext x='90' y='118' font-family='Georgia,serif' font-size='86' fill='%23E8D5C4' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Amai%20Studio%22%2C%22short_name%22%3A%22Amai%22%2C%22display%22%3A%22standalone%22%2C%22orientation%22%3A%22portrait%22%2C%22background_color%22%3A%22%23241F1C%22%2C%22theme_color%22%3A%22%23241F1C%22%2C%22start_url%22%3A%22.%22%7D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Mulish:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{margin:0;font-family:Mulish,sans-serif;color:#241F1C;background:#1A1614;display:flex;align-items:center;justify-content:center}
button{font-family:Mulish,sans-serif;cursor:pointer;color:#241F1C}
.serif{font-family:Marcellus,serif;font-weight:400}
.lbl{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#6E5B49}
.lbl-d{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#B39C88}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}

/* device */
.ipad{width:834px;height:1194px;max-width:100vw;max-height:100vh;background:#EFE9E1;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;position:relative}

/* rail */
.rail{background:#241F1C;display:flex;align-items:center;justify-content:space-between;padding:10px 18px calc(10px + env(safe-area-inset-bottom));gap:8px}
.tab{flex:1;min-width:0;min-height:62px;border:none;background:none;color:#8A7361;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;border-radius:14px;position:relative}
.tab .g{width:22px;height:22px;border:1.5px solid currentColor;border-radius:6px}
.tab.on{background:#3A322E;color:#E8D5C4}
.tab:active{opacity:.7}

/* panes */
.pane{display:flex;flex-direction:column;min-height:0}
.col{min-height:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 22px calc(16px);border-bottom:1px solid #DED0C0;background:#F7F1EA;padding-top:calc(16px + env(safe-area-inset-top))}
.body{padding:18px 22px 34px}
.aside-inline{padding:0 22px 4px}

.card{background:#F7F1EA;border:1px solid #E0D2C2;padding:18px 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;border:none;font-family:Marcellus,serif;font-size:16px;min-height:48px;padding:0 24px;border-radius:24px 24px 0 0;background:#3A322E;color:#F7F1EA}
.btn:active{background:#241F1C}
.btn-l{background:#E8D5C4;color:#3A322E}
.btn-o{background:transparent;color:#241F1C;border:1px solid #C9B8A4}
.btn-sm{min-height:42px;font-size:15px;padding:0 18px;border-radius:21px 21px 0 0}
.field{width:100%;background:#F7F1EA;border:1px solid #DED0C0;padding:13px 14px;font-size:16px;font-family:Mulish,sans-serif;outline:none;color:#241F1C}
.field::placeholder{color:#8A7361;opacity:1}
.field:focus{border-color:#8A7361}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding:5px 11px;border:1px solid #C9B8A4;color:#6E5B49;white-space:nowrap}
.pill.on{background:#3A322E;border-color:#3A322E;color:#E8D5C4}
.pill.warn{background:#E8D5C4;border-color:#C9B8A4;color:#3A322E}
.hide{display:none!important}

/* day schedule */
.slotline{display:grid;grid-template-columns:66px 1fr;gap:14px;align-items:stretch}
.appt{border-left:3px solid #3A322E;background:#F7F1EA;border-top:1px solid #E0D2C2;border-right:1px solid #E0D2C2;border-bottom:1px solid #E0D2C2;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;color:#241F1C;width:100%}
.appt.done{border-left-color:#B39C88;background:#EFE5D8;color:#6E5B49;opacity:1}
.appt.now{border-left-color:#E8D5C4;background:#3A322E;color:#E8D5C4}
.appt.cont{border-left-color:#C9B8A4;background:#EFE9E1;min-height:44px}
.free{border:1px dashed #D6C4B2;min-height:64px;display:flex;align-items:center;justify-content:space-between;padding:12px 14px;color:#8A7361;font-size:13.5px;background:transparent;width:100%}

/* week grid */
.week{display:grid;grid-template-columns:50px repeat(4,1fr);gap:4px}
.wcell{min-height:38px;border:1px solid #E5D8C9;background:#F7F1EA;font-size:11px;display:flex;align-items:center;justify-content:center;color:#6E5B49}
.wcell.full{background:#3A322E;border-color:#3A322E;color:#E8D5C4;font-size:10.5px;padding:0 4px;text-align:center;line-height:1.25}
.wcell.shut{background:#EFE5D8;border-color:#EFE5D8;color:#C9B8A4}

.sheetwrap{position:absolute;inset:0;background:rgba(26,22,20,.55);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.sheet{background:#EFE9E1;width:100%;max-height:88%;border-top:1px solid #DED0C0;padding:26px 30px 30px;overflow-y:auto}
.sheet.chat{display:flex;flex-direction:column;height:88%;overflow:hidden;padding:14px 0 0}
.sheet.chat .grab{margin-bottom:12px}
.chead{display:flex;align-items:center;gap:14px;padding:0 26px 16px;border-bottom:1px solid #DED0C0;flex:none}
.cthread{flex:1;min-height:0;overflow-y:auto;padding:20px 26px 8px;display:flex;flex-direction:column;gap:3px}
.cday{display:flex;align-items:center;gap:14px;margin:14px 0 12px}
.cday span{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#8A7361;flex:none}
.cday b{flex:1;height:1px;background:#DED0C0}
.cbub{max-width:74%;padding:12px 16px;font-size:15px;line-height:1.6;text-wrap:pretty}
.cbub.them{align-self:flex-start;background:#F7F1EA;border:1px solid #E0D2C2;color:#241F1C;border-radius:2px 16px 16px 16px}
.cbub.mine{align-self:flex-end;background:#3A322E;color:#F7F1EA;border-radius:16px 2px 16px 16px}
.cbub.run.them{border-top-left-radius:16px}
.cbub.run.mine{border-top-right-radius:16px}
.cts{font-size:11.5px;color:#8A7361;padding:4px 3px 11px}
.cts.mine{align-self:flex-end}
.cts.them{align-self:flex-start}
.cquick{display:flex;flex:none;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 26px 12px}
.cquick::-webkit-scrollbar{display:none}
.cquick button{flex:none;min-height:38px;padding:0 15px;font-size:13.5px;background:transparent;border:1px solid #C9B8A4;color:#5C5148;font-family:Mulish,sans-serif;border-radius:19px 19px 0 0}
.ccomp{display:flex;flex:none;align-items:flex-end;gap:10px;padding:14px 26px;border-top:1px solid #DED0C0;background:#F7F1EA}
.ccomp textarea{flex:1;min-height:46px;max-height:110px;resize:none;background:#EFE9E1;border:1px solid #DED0C0;color:#241F1C;padding:13px 15px;outline:none;font-family:Mulish,sans-serif;font-size:15px;line-height:1.5}
.ccomp textarea:focus{border-color:#8A7361}
.csend{min-height:46px;padding:0 22px;border:none;background:#3A322E;color:#F7F1EA;font-family:Marcellus,serif;font-size:15px;border-radius:23px 23px 0 0}
.csend:disabled{background:#DED0C0;color:#8A7361}
.cmore{display:flex;flex:none;gap:8px;flex-wrap:wrap;padding:0 26px 14px}
.grab{width:44px;height:4px;border-radius:2px;background:#C9B8A4;margin:0 auto 20px}
.kv{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid #E0D2C2;font-size:15px}
.chip{min-height:44px;padding:0 16px;font-size:15px;background:transparent;border:1px solid #DED0C0;color:#241F1C}
.chip[aria-pressed="true"]{background:#3A322E;color:#F7F1EA;border-color:#3A322E}
.seg{display:grid;grid-auto-flow:column;border:1px solid #DED0C0;background:#F7F1EA}
.seg button{min-height:42px;background:transparent;border:none;color:#6E5B49;font-size:14px;padding:0 10px}
.seg button[aria-pressed="true"]{background:#3A322E;color:#F7F1EA;font-weight:600}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.mhead{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding-bottom:5px}
.mhead span{text-align:center;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#8A7361}
.mcell{aspect-ratio:1/1;min-height:42px;border:1px solid #E5D8C9;background:#F7F1EA;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:Marcellus,serif;font-size:15px;color:#241F1C;padding:0}
.mcell u{width:4px;height:4px;border-radius:50%;background:#8A7361}
.mcell.shut{background:#3A322E;border-color:#3A322E;color:#E8D5C4}
.mcell.shut u{background:#E8D5C4}
.mcell.off{background:#EFE5D8;border-color:#EFE5D8;color:#C9B8A4}
.mcell.past{opacity:.35}
.mblank{aspect-ratio:1/1;min-height:42px}
.unread{width:9px;height:9px;border-radius:50%;background:#3A322E;flex:none}
.badge{position:absolute;top:9px;right:calc(50% - 21px);background:#E8D5C4;color:#3A322E;font-size:9px;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:Mulish,sans-serif;letter-spacing:0;font-weight:600}
.navrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.navbtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid #C9B8A4;color:#241F1C;font-size:16px}
.navbtn[disabled]{opacity:.3}
@media (max-width:520px){
  .topbar{padding-left:16px;padding-right:16px}
  .body{padding:16px 16px 30px}
  .aside-inline{padding:0 16px 4px}
  .slotline{grid-template-columns:52px 1fr;gap:10px}
  .week{grid-template-columns:42px repeat(4,1fr);gap:3px}
  .sheet{padding:22px 18px 26px}
  .sheet.chat{padding:14px 0 0}
  .chead,.cthread,.cquick,.ccomp,.cmore{padding-left:16px;padding-right:16px}
  .cbub{max-width:84%}
  #ttl{font-size:21px!important}
  #sub{display:none}
  .rail{padding-left:6px;padding-right:6px;gap:2px}
  .tab{font-size:8.5px;letter-spacing:.03em}
  .tab .g{width:20px;height:20px}
  .badge{right:calc(50% - 18px)}
}
@media (max-width:860px),(max-height:1220px){ .ipad{width:100vw;height:100vh} }
@media (display-mode:standalone){ .ipad{width:100vw;height:100vh} #install{display:none!important} }
</style>
<script src="/push-register.js"></script>
</head>
<body>

<div class="ipad">
  <!-- HEADER -->
  <div class="topbar">
    <div style="display:flex;align-items:baseline;gap:12px;min-width:0">
      <button class="navbtn hide" id="back" style="width:38px;height:38px;align-self:center;flex:none">←</button>
      <span class="serif" id="ttl" style="font-size:26px;white-space:nowrap"></span>
      <span id="sub" style="font-size:13px;color:#6E5B49;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></span>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="pill" id="clock"></span>
      <button class="btn btn-l btn-sm" id="quick">Add booking</button>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="pane scroll">
    <div class="aside-inline" id="aside"></div>
    <div class="body" id="view"></div>
  </div>

  <!-- TABS -->
  <div class="rail" id="tabs"></div>

  <div id="host"></div>

  <div id="install" class="hide" style="position:absolute;left:22px;right:22px;bottom:104px;background:#241F1C;color:#E8D5C4;padding:18px 22px;display:flex;align-items:center;gap:18px;z-index:30">
    <div style="width:34px;height:46px;border:1.4px solid #E8D5C4;border-bottom:none;border-radius:999px 999px 0 0;flex:none"></div>
    <div style="flex:1;min-width:0">
      <div class="serif" style="font-size:19px;margin-bottom:4px">Keep Amai Studio on your home screen.</div>
      <div style="font-size:13px;line-height:1.6;color:#B39C88" id="install-how">Tap Share, then <strong style="font-weight:600;color:#E8D5C4">Add to Home Screen</strong> — it opens full screen, without the browser bars.</div>
    </div>
    <button class="btn btn-sm" id="install-go" style="background:#E8D5C4;color:#3A322E;flex:none">Add</button>
    <button id="install-no" style="background:none;border:none;color:#8A7361;font-size:13px;flex:none">Not now</button>
  </div>
</div>

<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#241F1C"/><rect x="26" y="18" width="48" height="64" rx="5" fill="none" stroke="#E8D5C4" stroke-width="3"/></svg></template>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase.js"></script>
<script>
var $=function(i){return document.getElementById(i);};
var TIMES=["9.00","10.00","11.00","12.00","13.00","14.00","15.00","16.00","17.00"];
var DEFAULT_SERVICES=[
  {n:"First visit — consultation & treatment",d:60,p:30},{n:"Full leg wax",d:45,p:38},
  {n:"Half leg wax",d:30,p:26},{n:"Underarm wax",d:15,p:14},{n:"Arm wax",d:25,p:22},
  {n:"Facial waxing",d:15,p:12},{n:"Brow shape & tidy",d:20,p:16},{n:"Bikini wax",d:30,p:28},
  {n:"Brazilian wax",d:40,p:36},{n:"Hollywood wax",d:45,p:42},{n:"Maintenance visit",d:30,p:24}
];
function d0(){ var d=new Date(); d.setHours(0,0,0,0); return d; }
function shift(base,n){ var d=new Date(base); d.setDate(d.getDate()+n); return d; }
function iso(d){ return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate(); }
function parseKey(k){ var p=k.split("-"); return new Date(+p[0],+p[1],+p[2]); }
function open(d){ return d.getDay()!==0&&d.getDay()!==1; }
function nextOpen(n){
  var d=d0(), seen=0;
  while(!open(d)) d=shift(d,1);
  while(seen<n){ d=shift(d,1); while(!open(d)) d=shift(d,1); seen++; }
  return d;
}
function back(n){ var d=d0(), c=0; while(c<n){ d=shift(d,-1); if(open(d)) c++; } return d; }
function longDate(d){ return d.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"}); }
function shortDate(d){ return d.toLocaleDateString("en-GB",{day:"numeric",month:"short"}); }
function money(n){ return "£"+n; }
function hoursAgo(n){ return Date.now()-n*3600000; }
function daysAgo(n,h,m){ var d=new Date(); d.setDate(d.getDate()-n); d.setHours(h,m,0,0); return d.getTime(); }
function clockOf(ts){ return new Date(ts).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}); }
function dayOf(ts){
  var d=new Date(ts); d.setHours(0,0,0,0);
  var diff=Math.round((d0()-d)/86400000);
  if(diff===0) return "Today";
  if(diff===1) return "Yesterday";
  if(diff<7) return new Date(ts).toLocaleDateString("en-GB",{weekday:"long"});
  return new Date(ts).toLocaleDateString("en-GB",{day:"numeric",month:"long"});
}
function whenLabel(ts){
  var day=dayOf(ts);
  return (day==="Today"?"Today":day)+", "+clockOf(ts);
}

var KEY="amai_studio_v5";
function load(){ try{ return JSON.parse(localStorage.getItem(KEY))||null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }

function seed(){
  var t=nextOpen(0), t2=nextOpen(1), t3=nextOpen(2);
  return {
    view:"today", dayKey:iso(t), locked:false,
    clients:[],
    appts:[],
    requests:[],
    closed:{},
    promos:[],
    services:DEFAULT_SERVICES.map(function(s,i){ return {id:i+1,n:s.n,d:s.d,p:s.p,on:true}; })
  };
}
var S=load()||seed();
if(!S.clients) S=seed();
if(!S.services||!S.services.length) S.services=DEFAULT_SERVICES.map(function(s,i){ return {id:i+1,n:s.n,d:s.d,p:s.p,on:true}; });
if(!S.conversations) S.conversations=[];
if(!S.hours) S.hours={tue:{open:'9.00',close:'18.00'},wed:{open:'9.00',close:'18.00'},thu:{open:'9.00',close:'18.00'},fri:{open:'9.00',close:'18.00'},sat:{open:'9.00',close:'18.00'}};
if(!S.promos) S.promos=[];
if(!S.dmode) S.dmode="day";
if(!S.itab) S.itab="messages";
if(S.view==="requests") S.view="inbox";
if(S.view==="week"){ S.view="today"; S.dmode="week"; }

/* ---------- SUPABASE ---------- */
/* sb is initialized by /js/supabase.js */
function dayKeyToDate(k){
  var p=k.split("-"); var m=+p[1]+1; var d=+p[2];
  return p[0]+"-"+(m<10?"0":"")+m+"-"+(d<10?"0":"")+d;
}
function dateToDayKey(ds){
  var s=String(ds).split('T')[0];
  var p=s.split("-");
  return p[0]+"-"+(+p[1]-1)+"-"+(+p[2]);
}
async function loadAll(){
  try {
    /* services */
    var sr=await sb.from('services').select('*').order('id');
    if(sr.data&&sr.data.length){
      S.services=sr.data.map(function(r){
        return {id:r.id,n:r.name,d:r.duration_minutes||30,p:r.price||0,on:r.available!==false,cat:r.category||'Waxing'};
      });
    }
    /* clients */
    var cr=await sb.from('clients').select('*');
    if(cr.data&&cr.data.length){
      S.clients=cr.data.map(function(r){
        return {id:r.id,name:r.name||'Unknown',phone:r.phone||r.email||'',since:r.created_at?new Date(r.created_at).toLocaleDateString('en-GB',{month:'short',year:'numeric'}):'',stamps:r.stamps||0,plan:r.plan||null,notes:r.notes||'',visits:r.visits||0,spend:r.spend||0,email:r.email||''};
      });
    }
    /* bookings → appts */
    var br=await sb.from('bookings').select('*');
    if(br.data){
      S.appts=br.data.map(function(r){
        var cid=r.client_id||0;
        return {id:r.id,c:cid,s:r.treatment_name||'',t:r.appointment_time||'10.00',dur:r.duration_minutes||r.duration||45,p:Number(r.price)||0,dep:Number(r.deposit_amount||10),day:dateToDayKey(r.appointment_date),st:r.status==='completed'?'done':r.status==='cancelled'?'cancelled':'due',dbId:r.id, promo:r.promo_code||'', disc:Number(r.discount_amount)||0, notes:r.notes||''};
      }).filter(function(a){ return a.st!=='cancelled'; });
    }
    /* requests */
    var rr=await sb.from('requests').select('*');
    if(rr.data){
      S.requests=rr.data.map(function(r){
        return {id:r.id,name:r.name||'',phone:r.phone||'',s:r.service||'',want:r.preferred_time||'',note:r.note||''};
      });
    }
    /* closed days */
    var cd=await sb.from('closed_days').select('*');
    if(cd.data){
      S.closed={};
      cd.data.forEach(function(r){
        S.closed[r.date_key]={why:r.reason||''};
      });
    }
    /* promos */
    var pr = await sb.from('promos').select('*');
    if(pr.data) S.promos = pr.data.map(function(r){ return {id:r.id,code:r.code,kind:r.kind,val:Number(r.value),note:r.note||'',uses:r.uses||0,cap:r.cap||0,until:r.until||'',on:r.active!==false}; });
    /* opening hours */
    var sh=await sb.from('studio_settings').select('value').eq('key','opening_hours').single();
    if(sh.data && sh.data.value) S.hours=sh.data.value;
    
    /* conversations */
    var cv=await sb.from('conversations').select('*').order('last_message_at', {ascending: false});
    if(cv.data) S.conversations = cv.data;

    if(!window._realtimeInited) {
      window._realtimeInited = true;
      sb.channel('inbox').on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages'},function(payload){
        if(payload.new.sender==='client'){
          /* If the thread sheet is open for this conversation, push the message in */
          if(openThread && openThread.id === payload.new.conversation_id){
            if(!openThread.chat) openThread.chat = [];
            openThread.chat.push({who:'client', at:new Date(payload.new.created_at).getTime(), body:payload.new.body});
            refreshMsg(true);
            /* Mark as read since we're looking at it */
            sb.from('conversations').update({admin_unread:0}).eq('id', openThread.id);
          }
          loadAll().then(render);
        }
      }).subscribe();
      /* Listen for new bookings so they appear in the diary immediately */
      sb.channel('diary').on('postgres_changes',{event:'*',schema:'public',table:'bookings'},function(){
        loadAll().then(render);
      }).on('postgres_changes',{event:'*',schema:'public',table:'clients'},function(){
        loadAll().then(render);
      }).subscribe();
      /* Reload conversations when iPad wakes / app returns to foreground */
      document.addEventListener('visibilitychange', function(){
        if(!document.hidden) loadAll().then(render);
      });
      /* Backup poll every 30s in case WebSocket disconnects */
      setInterval(function(){ loadAll().then(render); }, 30000);
    }

    save();
  } catch(e){ console.warn('Supabase load error',e); }
}

/* closures carry a reason; older saves stored a bare true */
function closedInfo(k){ var v=S.closed[k]; if(!v) return null; return typeof v==="object"?v:{why:""}; }
function shutDay(k,why){ S.closed[k]={why:why||""}; sb.from('closed_days').upsert({date_key:k,reason:why||'Closed'},{onConflict:'date_key'}).then(function(r){ if(r.error) console.error('shutDay error',r.error); else console.log('shutDay OK',k); }); }
function unread(){ return S.conversations ? S.conversations.reduce(function(s,c){ return s+(c.admin_unread||0); },0) : 0; }
function inboxCount(){ return unread()+S.requests.length; }
function monthOf(off){ var t=d0(); return new Date(t.getFullYear(),t.getMonth()+(off||0),1); }
function inputDate(d){ var m=d.getMonth()+1, dd=d.getDate(); return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(dd<10?"0":"")+dd; }
function fromInput(v){ var p=String(v).split("-"); return new Date(+p[0],(+p[1])-1,+p[2]); }
function upcomingClosures(){
  var t=d0();
  return Object.keys(S.closed).map(function(k){ return {k:k,d:parseKey(k),why:(closedInfo(k)||{}).why||""}; })
    .filter(function(x){ return x.d>=t; })

/* ---------- helpers ---------- */
function client(id){ return S.clients.filter(function(c){ return String(c.id)===String(id); })[0] || {id:id,name:'Unknown',phone:'',since:'',stamps:0,plan:null,notes:'',visits:0,spend:0,email:''}; }
function dayAppts(k){ return S.appts.filter(function(a){ return a.day===k; }).sort(function(a,b){ return parseFloat(a.t)-parseFloat(b.t); }); }
function promoOf(code){ if(!code) return null; return S.promos.filter(function(p){ return p.code===code; })[0]||null; }
function bill(a){
  var gross=a.p, disc=0, label="";
  var p=a.promo?promoOf(a.promo):null;
  if(p){
    disc = p.kind==="%" ? Math.round(gross*p.val/100) : Math.min(gross,p.val);
    label = p.code+" · "+(p.kind==="%" ? p.val+"% off" : money(p.val)+" off");
  }
  var due=Math.max(0,gross-disc), dep=a.dep||0;
  var balance=Math.max(0,due-dep), credit=Math.max(0,dep-due);
  return {gross:gross,disc:disc,label:label,due:due,dep:dep,
          balance:balance,credit:credit,paid:dep+(a.st==="done"?balance:0),settled:a.st==="done"};
}
function takings(k){ return dayAppts(k).reduce(function(s,a){ return s+bill(a).due; },0); }
function outstanding(k){ return dayAppts(k).reduce(function(s,a){ return s+(a.st==="done"?0:bill(a).balance); },0); }
function bookable(){ return S.services.filter(function(s){ return s.on!==false; }); }
function slotIndex(t){ return TIMES.indexOf(t); }
function spanOf(dur){ return Math.max(1,Math.ceil((dur||60)/60)); }
function occupancy(k){
  var map={};
  dayAppts(k).forEach(function(a){
    var i=slotIndex(a.t); if(i<0) return;
    for(var j=0;j<spanOf(a.dur)&&i+j<TIMES.length;j++) map[TIMES[i+j]]={appt:a,start:j===0};
  });
  return map;
}
function fitsAt(k,t,dur,ignoreId){
  var i=slotIndex(t); if(i<0) return false;
  var need=spanOf(dur); if(i+need>TIMES.length) return false;
  var occ=occupancy(k);
  for(var j=0;j<need;j++){
    var cell=occ[TIMES[i+j]];
    if(cell&&cell.appt.id!==ignoreId) return false;
  }
  return true;
}

          '</div>'+

            '<button class="btn btn-l btn-sm" data-arrive="'+next.id+'">Mark arrived</button>'+
            '<button class="btn btn-sm" data-appt="'+next.id+'" style="background:transparent;border:1px solid rgba(232,213,196,.4);color:#E8D5C4">Open</button></div></div>';
      })()

    '<div class="lbl" style="margin-bottom:10px">Date</div>'+

    '<div style="display:flex;gap:10px;margin-top:24px">'+
      '<button class="btn btn-o btn-sm" id="sclose">Cancel</button>'+
      '<button class="btn btn-sm" id="ssave" style="flex:1">Add to the diary</button></div>');
  bindSheet();
  $("sclose").onclick=closeSheet;
  $("n-client").onchange=function(){ $("newfields").className=this.value==="new"?"":"hide"; };
  $("n-date").onchange=function(){

      if (cRes.data) {
        cid = cRes.data.id;
        S.clients.push({id:cid,name:nm,phone:ph,since:new Date().toLocaleDateString("en-GB",{month:"short",year:"numeric"}),stamps:0,plan:null,notes:"",visits:0,spend:0});
      } else {
        cid=Date.now();
        S.clients.push({id:cid,name:nm,phone:ph,since:new Date().toLocaleDateString("en-GB",{month:"short",year:"numeric"}),stamps:0,plan:null,notes:"",visits:0,spend:0});
      }
    } else cid=sel;
    var sv=bookable()[+$("n-svc").value];
    var bRes = await sb.from('bookings').insert({client_id:cid, treatment_name:sv.n, appointment_date: dayKeyToDate(draft.day), appointment_time: draft.time, price: sv.p, deposit_amount:10, duration_minutes: sv.d, status:'confirmed'}).select().single();
    var dbId = bRes.data ? bRes.data.id : null;
    S.appts.push({id:dbId||Date.now()+1,c:cid,s:sv.n,t:draft.time,dur:sv.d,p:sv.p,dep:10,day:draft.day,st:"due", dbId:dbId});
    save(); closeSheet(); render();
  };
}

var openThread=null;
function threadHTML(chat){
  var last="", out="";
  chat.forEach(function(x,i){
    var day=dayOf(x.at);
    if(day!==last){ out+='<div class="cday"><b></b><span>'+day+'</span><b></b></div>'; last=day; }
    var prev=chat[i-1], next=chat[i+1];
    var run = prev && prev.who===x.who && dayOf(prev.at)===day && (x.at-prev.at)<600000;
    var endRun = !(next && next.who===x.who && dayOf(next.at)===day && (next.at-x.at)<600000);
    var mine=x.who==="studio";
    out+='<div class="cbub '+(mine?"mine":"them")+(run?" run":"")+'">'+x.body+'</div>';
    if(endRun) out+='<div class="cts '+(mine?"mine":"them")+'">'+clockOf(x.at)+(mine?" · Sent":"")+'</div>';
  });
  return out;
}

function wire(scope){

  q("[data-appt]").forEach(function(b){ b.onclick=function(){ var a=S.appts.filter(function(x){ return String(x.id)===b.dataset.appt; })[0]; if(a) apptSheet(a); }; });
  q("[data-client]").forEach(function(b){ b.onclick=function(){ clientSheet(client(b.dataset.client)); }; });
  q("[data-fill]").forEach(function(b){ b.onclick=function(){ newSheet(S.dayKey,b.dataset.fill); }; });
  q("[data-new]").forEach(function(b){ b.onclick=function(){ var p=b.dataset.new.split("|"); newSheet(p[0],p[1]); }; });
  q("[data-jump]").forEach(function(b){ b.onclick=function(){ S.dayKey=b.dataset.jump; S.view="today"; save(); render(); }; });
  q("[data-day]").forEach(function(b){ b.onclick=function(){
    if(b.dataset.day==="today"){ S.dayKey=iso(nextOpen(0)); }
    else { var d=shift(parseKey(S.dayKey),+b.dataset.day); while(!open(d)) d=shift(d,+b.dataset.day); S.dayKey=iso(d); }
    save(); render(); }; });
  q("[data-arrive]").forEach(function(b){ b.onclick=async function(){
    var a=S.appts.filter(function(x){ return String(x.id)===b.dataset.arrive; })[0];
    a.st="done"; var c=client(a.c), bd=bill(a); c.stamps=Math.min(10,c.stamps+1); c.visits++; c.spend+=bd.due;
    if(a.dbId||a.id) await sb.from('bookings').update({status:'completed'}).eq('id', a.dbId||a.id);
    if(c.id) await sb.from('clients').update({stamps: c.stamps, visits: c.visits, spend: c.spend}).eq('id', c.id);
    save(); closeSheet(); render(); }; });
  q("[data-undone]").forEach(function(b){ b.onclick=async function(){
    var a=S.appts.filter(function(x){ return String(x.id)===String(b.dataset.undone); })[0];
    a.st="due"; var c=client(a.c), bd=bill(a); c.stamps=Math.max(0,c.stamps-1); c.visits=Math.max(0,c.visits-1); c.spend=Math.max(0,c.spend-bd.due);
    if(a.dbId||a.id) await sb.from('bookings').update({status:'confirmed'}).eq('id', a.dbId||a.id);
    if(c.id) await sb.from('clients').update({stamps: c.stamps, visits: c.visits, spend: c.spend}).eq('id', c.id);
    save(); closeSheet(); render(); }; });
  q("[data-cancelappt]").forEach(function(b){ b.onclick=async function(){
    var a = S.appts.filter(function(x){ return String(x.id)===String(b.dataset.cancelappt); })[0];
    if(!a) return;
    if(a.dbId||a.id) await sb.from('bookings').update({status:'cancelled'}).eq('id', a.dbId||a.id);
    S.appts=S.appts.filter(function(x){ return String(x.id)!==String(b.dataset.cancelappt); }); save(); closeSheet(); render(); }; });
  q("[data-svcedit]").forEach(function(b){ b.onclick=function(){ svcSheet(b.dataset.svcedit); }; });
  q("[data-svctoggle]").forEach(function(b){ b.onclick=async function(){
    var tid=b.dataset.svctoggle;
    S.services.forEach(function(s){ if(String(s.id)===tid) s.on = s.on===false; });
    var svc=S.services.filter(function(s){ return String(s.id)===tid; })[0];
    if(svc) await sb.from('services').update({available:svc.on}).eq('id',tid);
    save(); render(); }; });
  q("[data-svcdel]").forEach(function(b){ b.onclick=function(){
    var id=b.dataset.svcdel, s=S.services.filter(function(x){ return String(x.id)===id; })[0];
    if(!s) return;
    var booked=S.appts.filter(function(a){ return a.s===s.n&&a.st!=="done"; }).length;
    sheet('<div class="lbl" style="margin-bottom:10px">Remove a service</div>'+
      '<div class="serif" style="font-size:26px;margin-bottom:12px">Remove &ldquo;'+s.n+'&rdquo;?</div>'+
      '<p style="font-size:15px;line-height:1.75;color:#5C5148;margin:0 0 22px;max-width:60ch">'+
        (booked? "It is on "+booked+" appointment"+(booked>1?"s":"")+" still in the diary. Those stay exactly as they are — this only stops it being booked again. Hiding it does the same and keeps the record."
               : "It will no longer appear when you make a booking. Past appointments keep their names.")+"</p>"+
      '<div style="display:flex;gap:10px">'+
        '<button class="btn btn-o btn-sm" id="sclose">Keep it</button>'+
        '<button class="btn btn-o btn-sm" id="r-hide">Hide instead</button>'+
        '<button class="btn btn-sm" id="r-yes" style="flex:1">Remove</button></div>');
    $("sclose").onclick=closeSheet;
    $("r-hide").onclick=async function(){ S.services.forEach(function(x){ if(String(x.id)===id) x.on=false; }); await sb.from('services').update({available:false}).eq('id',id); save(); closeSheet(); render(); };
    $("r-yes").onclick=async function(){ S.services=S.services.filter(function(x){ return String(x.id)!==id; }); await sb.from('services').delete().eq('id',id); save(); closeSheet(); render(); };
  }; });
  q("[data-editday]").forEach(function(b){ b.onclick=function(){ hoursSheet(b.dataset.editday); }; });
  q("[data-stamp]").forEach(function(b){ b.onclick=async function(){ var c=client(b.dataset.stamp); c.stamps=Math.min(10,c.stamps+1); if(c.id) await sb.from('clients').update({stamps: c.stamps}).eq('id', c.id); save(); clientSheet(c); }; });
  q("[data-bookfor]").forEach(function(b){ b.onclick=function(){ closeSheet(); newSheet(S.dayKey,""); setTimeout(function(){ $("n-client").value=b.dataset.bookfor; },0); }; });
  q("[data-msgclient]").forEach(function(b){ b.onclick=async function(){
    var c=client(b.dataset.msgclient); if(!c) return;
    /* find existing conversation or create one */
    var conv=S.conversations.filter(function(x){ return String(x.client_id)===String(c.id); })[0];
    if(!conv){
      var res=await sb.from('conversations').insert({client_id:c.id, client_name:c.name, client_phone:c.phone||c.email||'', last_message_at:new Date().toISOString(), last_message_preview:'', last_sender:'studio', admin_unread:0, client_unread:0}).select().single();
      if(res.data){ conv=res.data; S.conversations.push(conv); save(); }
    }
    if(conv){ closeSheet(); openThread=conv.id; S.view="inbox"; save(); render(); loadThread(conv.id); }
  }; });
  q("[data-dismiss]").forEach(function(b){ b.onclick=function(){ S.requests=S.requests.filter(function(r){ return String(r.id)!==b.dataset.dismiss; }); save(); render(); }; });
  q("[data-offer]").forEach(function(b){ b.onclick=function(){
    var r=S.requests.filter(function(x){ return String(x.id)===b.dataset.offer; })[0];
    S.requests=S.requests.filter(function(x){ return x.id!==r.id; });
    var exists=S.clients.filter(function(c){ return c.phone===r.phone; })[0];
    if(!exists){ S.clients.push({id:Date.now(),name:r.name,phone:r.phone,since:new Date().toLocaleDateString("en-GB",{month:"short",year:"numeric"}),stamps:0,plan:null,notes:r.note,visits:0,spend:0}); }
    save(); newSheet(iso(nextOpen(1)),"");
    setTimeout(function(){
      var c=S.clients.filter(function(x){ return x.phone===r.phone; })[0];
      if(c&&$("n-client")) $("n-client").value=c.id;
      var i=bookable().map(function(s){ return s.n; }).indexOf(r.s);
      if(i>-1&&$("n-svc")) $("n-svc").value=i;
    },0);
  }; });
  q("[data-call]").forEach(function(b){ b.onclick=function(){ location.href="tel:"+b.dataset.call.replace(/\s/g,""); }; });
  q("[data-dmode]").forEach(function(b){ b.onclick=function(){ S.dmode=b.dataset.dmode; save(); render(); }; });
  q("[data-itab]").forEach(function(b){ b.onclick=function(){ S.itab=b.dataset.itab; save(); render(); }; });
  q("[data-open]").forEach(function(b){ b.onclick=function(){ S.view=b.dataset.open; S.moff=0; save(); render(); }; });
  q("[data-msg]").forEach(function(b){ b.onclick=function(){ msgSheet(b.dataset.msg); }; });
  q("[data-msgdel]").forEach(function(b){ b.onclick=async function(){
    var id=b.dataset.msgdel;
    await sb.from('chat_messages').delete().eq('conversation_id', id);
    await sb.from('conversations').delete().eq('id', id);
    S.conversations=S.conversations.filter(function(m){ return m.id!==id; }); 
    save(); closeSheet(); render(); 
  }; });
  q("[data-msgbook]").forEach(function(b){ b.onclick=function(){
    var m=S.conversations.filter(function(x){ return x.id===b.dataset.msgbook; })[0]; if(!m) return;
    var c=S.clients.filter(function(x){ return x.phone===m.client_phone; })[0];
    if(!c){ c={id:Date.now(),name:m.client_name,phone:m.client_phone,since:new Date().toLocaleDateString("en-GB",{month:"short",year:"numeric"}),stamps:0,plan:null,notes:"",visits:0,spend:0}; S.clients.push(c); save(); }
    closeSheet(); newSheet(iso(nextOpen(1)),"");
    setTimeout(function(){ if($("n-client")) $("n-client").value=c.id; },0); }; });
  q("[data-canned]").forEach(function(b){ b.onclick=function(){
    var ta=$("m-reply"); if(!ta) return;
    ta.value=b.dataset.canned;
    ta.style.height="auto"; ta.style.height=Math.min(110,ta.scrollHeight)+"px";
    if($("m-send")) $("m-send").disabled=false;
    ta.focus(); }; });
  q("[data-shut]").forEach(function(b){ b.onclick=function(){ closureSheet(b.dataset.shut); }; });
  q("[data-reopen]").forEach(function(b){ b.onclick=function(){ var rk=b.dataset.reopen; delete S.closed[rk]; sb.from('closed_days').delete().eq('date_key',rk).then(function(){}); save(); render(); }; });
  q("[data-moff]").forEach(function(b){ b.onclick=function(){ S.moff=Math.min(6,Math.max(0,(S.moff||0)+ +b.dataset.moff)); save(); render(); }; });
  q("[data-promoedit]").forEach(function(b){ b.onclick=function(){ promoSheet(isNaN(b.dataset.promoedit)?b.dataset.promoedit:+b.dataset.promoedit); }; });
  q("[data-promotoggle]").forEach(function(b){ b.onclick=async function(){
    var p=S.promos.filter(function(x){ return String(x.id)===b.dataset.promotoggle; })[0];
    if(p) { p.on = p.on===false; await sb.from('promos').update({active: p.on}).eq('id', p.id); }
    save(); render(); }; });
  q("[data-promodel]").forEach(function(b){ b.onclick=async function(){
    var id = isNaN(b.dataset.promodel) ? b.dataset.promodel : +b.dataset.promodel;
    await sb.from('promos').delete().eq('id', id);
    S.promos=S.promos.filter(function(p){ return p.id!==id; }); save(); closeSheet(); render(); }; });
  if(scope.getElementById&&scope.getElementById("addpromo")) scope.getElementById("addpromo").onclick=function(){ promoSheet(null); };
  if(scope.getElementById&&scope.getElementById("closerange")) scope.getElementById("closerange").onclick=rangeSheet;
  q("[data-tab]").forEach(function(b){ b.onclick=function(){ S.view=b.dataset.tab; save(); render(); }; });
  if(scope.getElementById&&scope.getElementById("addsvc")) scope.getElementById("addsvc").onclick=function(){ svcSheet(null); };
  if(scope.getElementById&&scope.getElementById("closeday")) scope.getElementById("closeday").onclick=function(){ closureSheet(S.dayKey); };
  if(scope.getElementById&&scope.getElementById("csearch")) scope.getElementById("csearch").oninput=function(){
    $("clist").innerHTML=clientRows(this.value); wire(document); };
}

/* ---------- render ---------- */
var TITLES={today:"Diary",clients:"Clients",inbox:"Inbox",money:"Takings",settings:"Studio",closures:"Closures",services:"Services & prices",promos:"Promo codes"};
function subline(){
  if(S.view==="today") return S.dmode==="week"? "The next four open days" : longDate(parseKey(S.dayKey));
  if(S.view==="clients") return S.clients.length+" on the books";
  if(S.view==="inbox"){ var u=unread(); return u? u+" unread · "+S.requests.length+" requests" : S.requests.length+" requests waiting"; }
  if(S.view==="money") return "Deposits and balances";
  if(S.view==="closures") return "Tap a date to block it out";
  if(S.view==="services") return bookable().length+" bookable of "+S.services.length;
  if(S.view==="promos") return S.promos.filter(function(p){ return p.on!==false; }).length+" live";
  return "";
}
function render(){
  try {
    tabs();
    $("ttl").textContent=TITLES[S.view]||"Diary";
    $("sub").textContent=subline();
    $("back").className = PARENT[S.view]? "navbtn" : "navbtn hide";
    $("quick").className = (S.view==="settings"||PARENT[S.view])? "btn btn-l btn-sm hide" : "btn btn-l btn-sm";
    $("view").innerHTML=(V[S.view]||V.today)();
    $("aside").innerHTML=aside();
    wire(document);
  } catch(e) {
    console.error('Render error:', e);
    $("view").innerHTML='<div style="padding:40px 20px;text-align:center"><div class="lbl" style="margin-bottom:12px;color:#c44">Something went wrong</div><div style="font-size:13px;color:#6E5B49;margin-bottom:16px">'+e.message+'</div><button class="btn btn-sm" onclick="location.reload(true)">Reload</button></div>';
  }
}
$("back").onclick=function(){ S.view=PARENT[S.view]||"settings"; save(); render(); };
function tick(){
  var n=new Date();
  $("clock").textContent=n.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
}
$("quick").onclick=function(){ newSheet(S.dayKey,""); };
$("clock").onclick=function(){ closeSheet(); S.view="today"; S.dayKey=iso(nextOpen(0)); save(); render(); };
tick(); setInterval(tick,20000);
/* boot with Supabase data then render */
(async function(){
  await loadAll();
  render();
})();

/* add to home screen */
(function(){
  var standalone = window.navigator.standalone || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
  var dismissed = false;
  try{ dismissed = localStorage.getItem("amai_studio_install")==="off"; }catch(e){}
  if(standalone||dismissed) return;
  var deferred=null;
  window.addEventListener("beforeinstallprompt",function(e){
    e.preventDefault(); deferred=e;
    $("install-how").textContent="Install it as an app — it opens full screen, without the browser bars.";
  });
  setTimeout(function(){ $("install").className=""; },1200);
  $("install-go").onclick=function(){
    if(deferred){ deferred.prompt(); deferred=null; $("install").className="hide"; return; }
    $("install-how").innerHTML='Tap the <strong style="font-weight:600;color:#E8D5C4">Share</strong> icon in Safari, scroll down, then choose <strong style="font-weight:600;color:#E8D5C4">Add to Home Screen</strong>.';
    $("install-go").className="hide";
  };
  $("install-no").onclick=function(){
    $("install").className="hide";
    try{ localStorage.setItem("amai_studio_install","off"); }catch(e){}
  };
})();
</script>
<script>
/* Admin push notification button handler */
(async function(){
  if(!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try { await navigator.serviceWorker.register('/sw.js'); } catch(e){}
  
  /* Check existing subscription on each render */
  var origRender = window.render;
  if(typeof origRender === 'function'){
    window.render = function(){
      origRender.apply(this, arguments);
      var btn = document.getElementById('push-btn');
      if(!btn) return;
      navigator.serviceWorker.ready.then(function(reg){
        reg.pushManager.getSubscription().then(function(sub){
          if(sub){ btn.textContent='Enabled ✓'; btn.disabled=true; btn.style.opacity='.5'; }
        });
      }).catch(function(){});
      btn.onclick = async function(){
        btn.textContent='Enabling…'; btn.disabled=true;
        var ok = await registerPush('admin');
        btn.textContent = ok ? 'Enabled ✓' : 'Not available';
        btn.style.opacity = '.5';
      };
    };
  }
})();
</script>
